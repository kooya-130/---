
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Mood Calendar</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');

:root {
  --red: #F07171;
  --yellow: #F4C84A;
  --green: #5BBF88;
  --background: #F5F6FA;
  --text: #252832;
  --sub: #999EAA;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--background);
  color: var(--text);
  min-height: 100vh;
  padding: 35px 16px;
}

.container {
  max-width: 440px;
  margin: 0 auto;
}

/* 상단 */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.logo {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.today-label {
  font-size: 12px;
  color: var(--sub);
  background: white;
  padding: 8px 13px;
  border-radius: 20px;
}

/* 달력 카드 */

.calendar-card {
  background: white;
  border-radius: 25px;
  padding: 25px 20px;
  box-shadow: 0 8px 30px rgba(30,40,70,0.04);
}

.month-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
}

.month-title {
  font-size: 23px;
  font-weight: 800;
  letter-spacing: -1px;
}

.month-controls {
  display: flex;
  gap: 8px;
}

.nav-btn {
  border: none;
  background: #F4F5F8;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  color: #555;
}

/* 요일 */

.weekdays, .calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
}

.weekdays {
  margin-bottom: 12px;
}

.weekdays div {
  font-size: 12px;
  font-weight: 600;
  color: var(--sub);
  padding: 8px 0;
}

.weekdays div:first-child {
  color: var(--red);
}

.calendar-grid {
  row-gap: 9px;
}

.day {
  border: none;
  background: transparent;
  height: 48px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  border-radius: 14px;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
}

.day.empty {
  pointer-events: none;
}

.day.today {
  outline: 1.5px solid #B8BEC9;
  outline-offset: -3px;
}

.day.selected {
  background: #F0F1F5;
}

.day.sunday {
  color: var(--red);
}

.day.mood-red {
  background: #FCE4E4;
}

.day.mood-yellow {
  background: #FFF3CC;
}

.day.mood-green {
  background: #DDF3E4;
}

.day .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.day.mood-red .dot {
  background: var(--red);
}

.day.mood-yellow .dot {
  background: var(--yellow);
}

.day.mood-green .dot {
  background: var(--green);
}

/* 범례 */

.legend {
  display: flex;
  justify-content: center;
  gap: 19px;
  margin-top: 23px;
  padding-top: 20px;
  border-top: 1px solid #F0F1F4;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #777D89;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* 월간 통계 */

.stats-card {
  background: white;
  border-radius: 22px;
  padding: 21px;
  margin-top: 17px;
  box-shadow: 0 8px 30px rgba(30,40,70,0.03);
}

.stats-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 17px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stat {
  border-radius: 15px;
  padding: 13px 5px;
  text-align: center;
}

.stat.red { background: #FCEAEA; }
.stat.yellow { background: #FFF5D8; }
.stat.green { background: #E2F4E8; }

.stat-count {
  font-size: 23px;
  font-weight: 800;
  margin-bottom: 5px;
}

.stat-label {
  font-size: 11px;
  color: #777;
}

/* 감정 선택창 */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20,25,40,0.3);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 10;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 440px;
  background: white;
  border-radius: 25px 25px 0 0;
  padding: 25px 23px 35px;
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-handle {
  width: 38px;
  height: 4px;
  border-radius: 5px;
  background: #E1E2E7;
  margin: -10px auto 23px;
}

.modal-date {
  font-size: 19px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 8px;
}

.modal-subtitle {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-bottom: 25px;
}

.mood-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.mood-option {
  border: 2px solid transparent;
  border-radius: 17px;
  padding: 17px 5px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
}

.mood-option span {
  display: block;
  font-size: 25px;
  margin-bottom: 9px;
}

.mood-option.red {
  background: #FCEAEA;
  color: #C85A5A;
}

.mood-option.yellow {
  background: #FFF5D8;
  color: #AA861E;
}

.mood-option.green {
  background: #E2F4E8;
  color: #3F9566;
}

.mood-option.active {
  border-color: currentColor;
}

.clear-btn {
  display: block;
  margin: 18px auto 0;
  background: none;
  border: none;
  color: #A0A3AD;
  font-size: 12px;
  cursor: pointer;
  padding: 10px;
}

@media (min-width: 600px) {
  body {
    padding-top: 60px;
  }

  .modal-overlay {
    align-items: center;
  }

  .modal {
    border-radius: 25px;
    margin: 20px;
    padding-bottom: 28px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="top">
    <div class="logo">MY MOOD ✳</div>
    <div class="today-label" id="todayLabel"></div>
  </header>

  <main>

    <section class="calendar-card">

      <div class="month-header">
        <div class="month-title" id="monthTitle"></div>

        <div class="month-controls">
          <button class="nav-btn" id="prevMonth">‹</button>
          <button class="nav-btn" id="nextMonth">›</button>
        </div>
      </div>

      <div class="weekdays">
        <div>일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div>토</div>
      </div>

      <div class="calendar-grid" id="calendar"></div>

      <div class="legend">
        <div class="legend-item">
          <span class="legend-dot" style="background:#F07171"></span>
          화났어요
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background:#F4C84A"></span>
          그저 그래요
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background:#5BBF88"></span>
          좋았어요
        </div>
      </div>

    </section>

    <section class="stats-card">
      <div class="stats-title">이번 달 나의 감정</div>

      <div class="stats">
        <div class="stat red">
          <div class="stat-count" id="redCount">0</div>
          <div class="stat-label">화났어요</div>
        </div>

        <div class="stat yellow">
          <div class="stat-count" id="yellowCount">0</div>
          <div class="stat-label">그저 그래요</div>
        </div>

        <div class="stat green">
          <div class="stat-count" id="greenCount">0</div>
          <div class="stat-label">좋았어요</div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- 감정 선택창 -->

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

    <div class="modal-handle"></div>

    <div class="modal-date" id="modalDate"></div>
    <div class="modal-subtitle">
      오늘 하루는 어떤 감정이었나요?
    </div>

    <div class="mood-options">

      <button class="mood-option red" data-mood="red">
        <span>☹</span>
        화났어요
      </button>

      <button class="mood-option yellow" data-mood="yellow">
        <span>😐</span>
        그저 그래요
      </button>

      <button class="mood-option green" data-mood="green">
        <span>☺</span>
        좋았어요
      </button>

    </div>

    <button class="clear-btn" id="clearMood">
      기록 삭제하기
    </button>

  </div>
</div>

<script>

const calendar = document.getElementById('calendar');
const monthTitle = document.getElementById('monthTitle');
const modalOverlay = document.getElementById('modalOverlay');

const today = new Date();

let currentYear = today.getFullYear();
let currentMonth = today.getMonth();
let selectedDate = null;

let moods = JSON.parse(
  localStorage.getItem('myMoodData') || '{}'
);

const moodNames = {
  red: '화났어요',
  yellow: '그저 그래요',
  green: '좋았어요'
};

function dateKey(year, month, day) {
  return `${year}-${String(month + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function saveData() {
  localStorage.setItem('myMoodData', JSON.stringify(moods));
}

function renderCalendar() {

  calendar.innerHTML = '';

  monthTitle.textContent =
    `${currentYear}년 ${currentMonth + 1}월`;

  const firstDay = new Date(
    currentYear, currentMonth, 1
  ).getDay();

  const lastDate = new Date(
    currentYear, currentMonth + 1, 0
  ).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'day empty';
    calendar.appendChild(empty);
  }

  for (let day = 1; day <= lastDate; day++) {

    const key = dateKey(
      currentYear, currentMonth, day
    );

    const mood = moods[key];

    const button = document.createElement('button');
    button.className = 'day';

    if (mood) {
      button.classList.add(`mood-${mood}`);
    }

    if (
      currentYear === today.getFullYear() &&
      currentMonth === today.getMonth() &&
      day === today.getDate()
    ) {
      button.classList.add('today');
    }

    if (firstDay === 0 && false) {
      button.classList.add('sunday');
    }

    if ((firstDay + day - 1) % 7 === 0) {
      button.classList.add('sunday');
    }

    button.innerHTML = `
      <span>${day}</span>
      ${mood ? '<span class="dot"></span>' : ''}
    `;

    button.addEventListener('click', () => {
      openModal(key, day);
    });

    calendar.appendChild(button);
  }

  updateStats();
}

function updateStats() {

  const counts = {
    red: 0,
    yellow: 0,
    green: 0
  };

  const prefix = dateKey(
    currentYear, currentMonth, 1
  ).slice(0, 7);

  Object.keys(moods).forEach(key => {
    if (key.startsWith(prefix)) {
      counts[moods[key]]++;
    }
  });

  document.getElementById('redCount').textContent =
    counts.red;

  document.getElementById('yellowCount').textContent =
    counts.yellow;

  document.getElementById('greenCount').textContent =
    counts.green;
}

function openModal(key, day) {

  selectedDate = key;

  document.getElementById('modalDate').textContent =
    `${currentYear}년 ${currentMonth + 1}월 ${day}일`;

  document.querySelectorAll('.mood-option').forEach(btn => {
    btn.classList.toggle(
      'active',
      btn.dataset.mood === moods[key]
    );
  });

  modalOverlay.classList.add('show');
}

function closeModal() {
  modalOverlay.classList.remove('show');
  selectedDate = null;
}

document.querySelectorAll('.mood-option').forEach(btn => {

  btn.addEventListener('click', () => {

    if (!selectedDate) return;

    moods[selectedDate] = btn.dataset.mood;

    saveData();
    renderCalendar();
    closeModal();

  });

});

document.getElementById('clearMood').addEventListener(
  'click', () => {

    if (!selectedDate) return;

    delete moods[selectedDate];

    saveData();
    renderCalendar();
    closeModal();

  }
);

modalOverlay.addEventListener('click', event => {
  if (event.target === modalOverlay) {
    closeModal();
  }
});

document.getElementById('prevMonth').addEventListener(
  'click', () => {

    currentMonth--;

    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }

    renderCalendar();
  }
);

document.getElementById('nextMonth').addEventListener(
  'click', () => {

    currentMonth++;

    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }

    renderCalendar();
  }
);

// 오늘 날짜 표시

document.getElementById('todayLabel').textContent =
  `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

// 첫 화면 실행

renderCalendar();

</script>

</body>
</html>
